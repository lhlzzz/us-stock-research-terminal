<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌙 Xiaomei · 美股 AI 投资终端</title>
<style>
:root {
  --bg: #FFF7FB; --bg-card: #FFFFFF;
  --primary: #FF8FB8; --primary-light: #FFD6E7; --primary-dark: #E8709E;
  --purple: #C8A7FF; --purple-light: #E8D5FF;
  --green: #A8E6CF; --green-dark: #7BC8A4;
  --red: #FFB3B3; --red-dark: #FF8A8A;
  --yellow: #FFE5A0; --yellow-dark: #E8C84A;
  --text: #4A3347; --text-2: #8B7089; --text-3: #BFA8BC;
  --border: #F5E6F0; --glow: rgba(255,143,184,0.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 3px; }
.shell { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: 220px; min-height: 100vh; position: fixed; left: 0; top: 0; z-index: 50;
  background: linear-gradient(180deg, #FFF0F6 0%, #F5E6F0 100%);
  border-right: 1px solid var(--border); padding: 16px 10px;
  display: flex; flex-direction: column; overflow-y: auto;
}
.sidebar-brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px; margin-bottom: 16px; }
.sidebar-brand span.emoji { font-size: 18px; }
.sidebar-brand span.label { font-size: 12px; font-weight: 600; color: var(--text-3); }
.sidebar-identity { display: flex; align-items: center; gap: 10px; padding: 0 8px; margin-bottom: 20px; }
.sidebar-avatar {
  width: 36px; height: 36px; border-radius: 50%; font-size: 18px;
  background: linear-gradient(135deg, var(--purple-light) 0%, var(--primary-light) 100%);
  display: flex; align-items: center; justify-content: center;
}
.sidebar-name { font-size: 15px; font-weight: 800; }
.sidebar-sub { font-size: 10px; color: var(--text-3); }
.sidebar nav { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px;
  border: none; background: transparent; cursor: pointer; width: 100%; text-align: left;
  font-size: 13px; color: var(--text-2); transition: all 0.15s;
}
.nav-item:hover { background: rgba(255,214,231,0.4); }
.nav-item.active { background: rgba(255,214,231,0.8); font-weight: 600; color: var(--primary-dark); }
.nav-item .icon { font-size: 16px; width: 22px; text-align: center; }
.nav-group { position: relative; }
.sub-nav { display: none; padding-left: 16px; background: rgba(255,214,231,0.2); border-radius: 0 0 10px 10px; }
.nav-group.open .sub-nav { display: block; }
.nav-item.sub { padding: 6px 10px; font-size: 12px; }
.sidebar-footer { margin-top: auto; padding: 8px; text-align: center; font-size: 10px; color: var(--text-3); }

/* Main */
.main { flex: 1; margin-left: 220px; padding: 20px 28px; min-height: 100vh; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.header h1 { font-size: 22px; font-weight: 800; }
.header p { font-size: 13px; color: var(--text-2); margin-top: 2px; }

/* Cards */
.card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 2px 8px rgba(255,143,184,0.08); transition: all 0.25s; animation: fade-in 0.3s ease-out;
  margin-bottom: 20px;
}
.card:hover { box-shadow: 0 4px 16px rgba(255,143,184,0.15); }
.card-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.card-head h2 { font-size: 14px; font-weight: 700; }
.card-head .sub { font-size: 11px; color: var(--text-3); }
.card-body { padding: 18px; }
@keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* Stat Grid */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
  box-shadow: 0 2px 8px rgba(255,143,184,0.08); transition: all 0.25s;
}
.stat-card:hover { box-shadow: 0 4px 16px rgba(255,143,184,0.15); transform: translateY(-2px); }
.stat-card .label { font-size: 11px; color: var(--text-3); font-weight: 500; }
.stat-card .value { font-size: 20px; font-weight: 800; margin-top: 4px; font-family: ui-monospace, monospace; }
.stat-card .change { font-size: 11px; margin-top: 4px; font-weight: 600; }
.up { color: var(--green-dark); }
.down { color: var(--red-dark); }

/* Table */
table { width: 100%; border-collapse: collapse; }
th { padding: 8px 12px; text-align: left; font-size: 10px; font-weight: 600; color: var(--text-3); border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.06em; position: sticky; top: 0; background: var(--bg-card); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
tr:hover td { background: rgba(255,214,231,0.15); }
.ticker { font-weight: 700; color: var(--purple); font-family: ui-monospace, monospace; font-size: 13px; cursor: pointer; }
.ticker:hover { text-decoration: underline; }

/* Pills */
.side-pill { display: inline-flex; min-width: 46px; justify-content: center; padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 600; }
.side-long { background: #D4F5E9; color: #2D7A52; }
.side-short { background: #FFE0E0; color: #C44; }
.pill { display: inline-flex; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 600; }
.pill-green { background: #D4F5E9; color: #2D7A52; }
.pill-red { background: #FFE0E0; color: #C44; }
.pill-yellow { background: #FFF5D4; color: #8B6914; }
.pill-blue { background: #D4E8FF; color: #2D5A8B; }
.pill-gray { background: #EEE; color: #888; }

/* Position row */
.pos-row { cursor: pointer; }
.reason-detail { padding: 12px 14px; background: var(--primary-light); border-radius: 0; }
.reason-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.reason-grid div { padding: 6px 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; }
.reason-grid .kicker { display: block; margin-bottom: 2px; color: var(--primary); font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
.reason-grid p { margin: 0; font-size: 11px; line-height: 1.4; }
.reason-summary { margin-top: 8px; padding: 8px 12px; background: var(--bg-card); border-left: 3px solid var(--primary); border-radius: 0 8px 8px 0; font-size: 11px; line-height: 1.5; }

/* Empty / Loading */
.empty { padding: 24px; text-align: center; color: var(--text-3); }
.loading { padding: 24px; text-align: center; color: var(--primary); }
.loading::after { content: ''; display: inline-block; width: 16px; height: 16px; border: 2px solid var(--primary-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; margin-left: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Refresh indicator */
.refresh-indicator { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.refresh-indicator.live { background: #D4F5E9; color: #2D7A52; }
.refresh-indicator.stale { background: #FFF5D4; color: #8B6914; }

/* Footer */
.foot { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 10px; }

/* Chart helpers */
.chart-bar { display: flex; align-items: end; gap: 3px; height: 60px; }
.chart-bar div { background: var(--primary-light); border-radius: 3px 3px 0 0; min-width: 8px; transition: height 0.3s; }
.chart-bar div.pos { background: var(--green); }
.chart-bar div.neg { background: var(--red); }

/* Date picker */
.date-input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; background: var(--bg-card); color: var(--text); }
.filter-row { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.filter-btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); cursor: pointer; font-size: 11px; font-weight: 600; color: var(--text-2); transition: all 0.15s; }
.filter-btn:hover, .filter-btn.active { background: var(--primary-light); color: var(--primary-dark); border-color: var(--primary); }

/* Modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); z-index: 100; display: flex; align-items: center; justify-content: center; }
.modal { background: var(--bg-card); border-radius: 16px; padding: 24px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.modal h3 { font-size: 16px; margin-bottom: 16px; }
.modal-close { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-3); }

/* Two-column grid */
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

/* Severity badge */
.severity-critical { background: #FFE0E0; color: #C44; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
.severity-high { background: #FFE8CC; color: #B45; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
.severity-medium { background: #FFF5D4; color: #8B6914; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }

/* Mini bar chart */
.mini-bar { display: flex; align-items: end; gap: 1px; height: 24px; }
.mini-bar span { display: block; min-width: 3px; border-radius: 1px; }

/* Scrollable table wrapper */
.table-scroll { max-height: 400px; overflow-y: auto; }

@media (max-width: 1080px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } .grid-2 { grid-template-columns: 1fr; } }
@media (max-width: 700px) { .sidebar { display: none; } .main { margin-left: 0; padding: 12px; } .stat-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="emoji">🌸</span><span class="label">Financial OS</span></div>
    <div class="sidebar-identity">
      <div class="sidebar-avatar">🐱</div>
      <div><div class="sidebar-name">Xiaomei</div><div class="sidebar-sub">美股 AI 投资助手</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer"><span id="refresh-indicator"></span></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
// ─── Config ─────────────────────────────────────────────────
const API = window.location.pathname.includes('/xiaomei') ? '/xiaomei' : '';
const $ = id => document.getElementById(id);
const esc = v => String(v??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => `$${Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const pct = (v,d=2) => `${Number(v||0)>=0?'+':''}${(Number(v||0)*100).toFixed(d)}%`;
const pctRaw = (v,d=1) => `${Number(v||0)>=0?'+':''}${Number(v||0).toFixed(d)}%`;
const cls = v => Number(v||0)>=0?'up':'down';
const num = (v,d=4) => Number(v||0).toFixed(d);
const fmtDate = v => v ? String(v).slice(0,10) : '--';
const debounce = (fn,ms=300) => { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; };

let lastRefresh = null;
setInterval(() => {
  const el = $('refresh-indicator');
  if (!el || !lastRefresh) return;
  const ago = Math.floor((Date.now()-lastRefresh)/1000);
  el.innerHTML = ago < 60
    ? `<span class="refresh-indicator live">● 在线 ${ago}s</span>`
    : `<span class="refresh-indicator stale">● ${Math.floor(ago/60)}m前更新</span>`;
}, 1000);

async function api(ep) {
  try {
    const r = await fetch(`${API}${ep}`, {cache:'no-store'});
    if (!r.ok) throw new Error(`${r.status}`);
    lastRefresh = Date.now();
    return await r.json();
  } catch(e) { console.error(`API ${ep}:`, e); return null; }
}

// ─── Navigation ─────────────────────────────────────────────
const NAV = [
  {id:'dashboard', icon:'📊', label:'系统仪表盘'},
  {id:'simulation', icon:'💼', label:'模拟交易'},
  {id:'picks', icon:'🎫', label:'AI出票', children:[
    {id:'picks/today', icon:'📋', label:'最新出票'},
    {id:'picks/history', icon:'📅', label:'历史出票'},
    {id:'picks/factors', icon:'🧬', label:'因子分析'},
  ]},
  {id:'signals', icon:'📡', label:'AI信号', children:[
    {id:'signals/effectiveness', icon:'🎯', label:'信号有效性'},
    {id:'signals/raw', icon:'📶', label:'原始信号'},
  ]},
  {id:'records', icon:'📑', label:'出票记录'},
  {id:'research', icon:'🔬', label:'公司研究', children:[
    {id:'research/stock', icon:'🔎', label:'个股研究'},
    {id:'research/candidates', icon:'📋', label:'候选池'},
    {id:'research/universe', icon:'🌐', label:'Universe'},
  ]},
  {id:'system', icon:'⚙️', label:'系统状态', children:[
    {id:'system/regime', icon:'🌊', label:'市场Regime'},
    {id:'system/degradation', icon:'⚠️', label:'退化检测'},
    {id:'system/weights', icon:'⚖️', label:'因子权重'},
    {id:'system/obsidian', icon:'🧠', label:'知识库'},
  ]},
];

let currentPage = 'dashboard';

function renderNav() {
  $('nav').innerHTML = NAV.map(item => {
    if (item.children) {
      const isOpen = currentPage.startsWith(item.id);
      return `<div class="nav-group${isOpen?' open':''}">
        <button class="nav-item${isOpen?' active':''}" onclick="toggleGroup(this)">
          <span class="icon">${item.icon}</span>${item.label}
        </button>
        <div class="sub-nav">${item.children.map(c =>
          `<button class="nav-item sub${currentPage===c.id?' active':''}" onclick="nav('${c.id}')">
            <span class="icon">${c.icon}</span>${c.label}
          </button>`
        ).join('')}</div>
      </div>`;
    }
    return `<button class="nav-item${currentPage===item.id?' active':''}" onclick="nav('${item.id}')">
      <span class="icon">${item.icon}</span>${item.label}
    </button>`;
  }).join('');
}

function nav(page) { currentPage = page; window.location.hash = page; renderNav(); renderPage(); }
function toggleGroup(el) { el.parentElement.classList.toggle('open'); }
function parseHash() { currentPage = window.location.hash.slice(1) || 'dashboard'; }
window.addEventListener('hashchange', () => { parseHash(); renderNav(); renderPage(); });

// ─── Mini SVG bar chart ─────────────────────────────────────
function miniBar(data, w=120, h=30) {
  if (!data || !data.length) return '';
  const max = Math.max(...data.map(d=>Math.abs(d)), 0.001);
  const bw = Math.max(3, Math.floor(w/data.length)-1);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${data.map((v,i) => {
    const bh = Math.abs(v)/max * (h/2);
    const y = v>=0 ? h/2-bh : h/2;
    return `<rect x="${i*(bw+1)}" y="${y}" width="${bw}" height="${bh}" rx="1" fill="${v>=0?'#7BC8A4':'#FF8A8A'}" opacity="0.7"/>`;
  }).join('')}<line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#ddd" stroke-width="0.5"/></svg>`;
}

// ─── Pages ──────────────────────────────────────────────────
async function renderPage() {
  const m = $('main');
  switch(currentPage) {
    case 'dashboard': return renderDashboard(m);
    case 'simulation': return renderSimulation(m);
    case 'picks/today': return renderPicksToday(m);
    case 'picks/history': return renderPicksHistory(m);
    case 'picks/factors': return renderFactors(m);
    case 'signals/effectiveness': return renderSignalEffectiveness(m);
    case 'signals/raw': return renderSignalsRaw(m);
    case 'records': return renderRecords(m);
    case 'research/stock': return renderResearchStock(m);
    case 'research/candidates': return renderResearchCandidates(m);
    case 'research/universe': return renderResearchUniverse(m);
    case 'system/regime': return renderRegime(m);
    case 'system/degradation': return renderDegradation(m);
    case 'system/weights': return renderWeights(m);
    case 'system/obsidian': return renderObsidian(m);
    default: m.innerHTML = '<div class="empty">页面不存在</div>';
  }
}

// ── Dashboard ───────────────────────────────────────────────
async function renderDashboard(m) {
  m.innerHTML = header('📊 系统仪表盘', '全局概览 · 收益统计 · 退化监控');
  const [overview, ftStats, deg, regime] = await Promise.all([
    api('/stats/overview'), api('/api/forward-tracking/stats'),
    api('/api/degradation'), api('/api/market-regime?limit=1'),
  ]);

  // Stat grid
  let stats = '';
  if (overview) {
    const wr = overview.overall_win_rate ? (overview.overall_win_rate*100).toFixed(1)+'%' : '--';
    const ar = overview.overall_avg_return ? (overview.overall_avg_return*100).toFixed(2)+'%' : '--';
    stats = statGrid([
      {label:'🧾 总出票', value: overview.total_tickets||0, sub:'历史累计'},
      {label:'✅ 已回填', value: overview.total_completed||0, sub:'forward_tracking'},
      {label:'🎯 总胜率', value: wr, sub: cls(overview.overall_win_rate-0.5), change:'历史统计'},
      {label:'📈 平均收益', value: ar, sub: cls(overview.overall_avg_return), change:'所有周期'},
    ]);
  }
  m.innerHTML += stats;

  // Forward tracking by horizon
  if (ftStats && ftStats.length) {
    let rows = ftStats.map(r => `<tr>
      <td><strong>${r.horizon_days}天</strong></td>
      <td>${r.total}</td>
      <td class="${cls(r.win_rate-0.5)}">${(r.win_rate*100).toFixed(1)}%</td>
      <td class="${cls(r.avg_return)}">${pct(r.avg_return)}</td>
      <td class="${cls(r.avg_win)}">${pct(r.avg_win)}</td>
      <td class="${cls(r.avg_loss)}">${pct(r.avg_loss)}</td>
      <td>${pct(r.worst)}</td><td>${pct(r.best)}</td>
    </tr>`).join('');
    m.innerHTML += card('📊 分周期收益统计', 'forward_tracking by horizon',
      `<table><thead><tr><th>周期</th><th>样本</th><th>胜率</th><th>平均收益</th><th>平均盈利</th><th>平均亏损</th><th>最差</th><th>最好</th></tr></thead><tbody>${rows}</tbody></table>`);
  }

  // Degradation alerts
  if (deg && deg.degradation && deg.degradation.length) {
    let alerts = deg.degradation.map(d => `<div style="padding:8px 12px;margin-bottom:6px;border-radius:8px;background:${d.severity==='CRITICAL'?'#FFE0E0':d.severity==='HIGH'?'#FFE8CC':'#FFF5D4'}">
      <span class="severity-${d.severity.toLowerCase()}">${d.severity}</span>
      <span style="margin-left:8px;font-size:12px">${esc(d.message)}</span>
    </div>`).join('');
    m.innerHTML += card('⚠️ 退化告警', `${deg.degradation_count} issues detected`, alerts);
  } else {
    m.innerHTML += card('✅ 系统健康', '无退化检测', '<div style="padding:8px;color:var(--green-dark)">所有指标在正常范围内</div>');
  }

  // Market regime
  if (regime && regime.length) {
    const r = regime[0];
    m.innerHTML += card('🌊 当前市场Regime', fmtDate(r.trade_date),
      `<div class="grid-3">
        <div><div style="font-size:10px;color:var(--text-3)">Regime</div><div style="font-size:16px;font-weight:700">${esc(r.regime||'--')}</div></div>
        <div><div style="font-size:10px;color:var(--text-3)">广度</div><div style="font-size:16px;font-weight:700">${num(r.breadth,2)}</div></div>
        <div><div><div style="font-size:10px;color:var(--text-3)">动量</div><div style="font-size:16px;font-weight:700">${num(r.momentum,4)}</div></div></div>
      </div>`);
  }

  // Date range
  if (overview && overview.date_range) {
    m.innerHTML += `<div style="font-size:11px;color:var(--text-3);text-align:right;margin-top:8px">数据范围: ${overview.date_range.earliest} ~ ${overview.date_range.latest}</div>`;
  }
  m.innerHTML += footer();
}

// ── Simulation ──────────────────────────────────────────────
async function renderSimulation(m) {
  m.innerHTML = header('💼 模拟交易', '持仓管理 · 交易理由 · 风控状态');
  const data = await api('/api/positions');
  if (!data) { m.innerHTML += '<div class="empty">无法加载持仓数据</div>'; return; }

  // Stats
  m.innerHTML += statGrid([
    {label:'💰 总权益', value: money(data.equity), sub: cls(data.pnl), change:`${pctRaw(data.pnl_pct)} (${money(data.pnl)})`},
    {label:'📈 持仓数', value: data.position_count||0, sub:'', change:'活跃持仓'},
    {label:'💵 现金', value: money(data.cash), sub:'', change:'可用资金'},
    {label:'🎯 胜率', value: data.win_rate!=null?data.win_rate.toFixed(1)+'%':'--', sub:'', change:'历史统计'},
  ]);

  // Positions table
  const positions = data.positions || [];
  if (!positions.length) {

// ── Picks History ───────────────────────────────────────────
async function renderPicksHistory(m) {
  m.innerHTML = header('📅 历史出票', '按日期浏览 · 筛选 · 对比');
  const stats = await api('/stats/overview');
  if (!stats) { m.innerHTML += '<div class="empty">无法加载数据</div>'; return; }

  m.innerHTML += statGrid([
    {label:'🧾 总出票', value: stats.total_tickets||0, sub:'', change:'累计'},
    {label:'✅ 已完成', value: stats.total_completed||0, sub:'', change:'forward_tracking'},
    {label:'🎯 胜率', value: stats.overall_win_rate?(stats.overall_win_rate*100).toFixed(1)+'%':'--', sub: cls(stats.overall_win_rate-0.5), change:''},
    {label:'📈 平均收益', value: stats.overall_avg_return?(stats.overall_avg_return*100).toFixed(2)+'%':'--', sub: cls(stats.overall_avg_return), change:''},
  ]);

  // Load returns for historical view
  const returns = await api('/returns?limit=500');
  if (returns && returns.length) {
    // Group by output_date
    const byDate = {};
    returns.forEach(r => {
      const d = r.output_date;
      if (!byDate[d]) byDate[d] = {total:0, wins:0, sumRet:0, symbols:[]};
      byDate[d].total++;
      if (r.forward_return > 0) byDate[d].wins++;
      byDate[d].sumRet += Number(r.forward_return||0);
      byDate[d].symbols.push(r.symbol);
    });
    let rows = Object.entries(byDate).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30).map(([d,s]) => {
      const wr = s.total>0?(s.wins/s.total*100).toFixed(0):'0';
      const avg = s.total>0?(s.sumRet/s.total*100).toFixed(2):'0';
      return `<tr>
        <td>${fmtDate(d)}</td>
        <td>${s.total}</td>
        <td class="${Number(wr)>=50?'up':'down'}">${wr}%</td>
        <td class="${Number(avg)>=0?'up':'down'}">${Number(avg)>=0?'+':''}${avg}%</td>
        <td style="font-size:11px">${[...new Set(s.symbols)].slice(0,5).map(s=>`<span class="ticker" style="font-size:11px">${s}</span>`).join(' ')}</td>
      </tr>`;
    }).join('');
    m.innerHTML += card('📅 每日出票汇总', `${Object.keys(byDate).length}天`,
      `<div class="table-scroll"><table><thead><tr><th>日期</th><th>票数</th><th>胜率</th><th>平均收益</th><th>标的</th></tr></thead><tbody>${rows}</tbody></table></div>`);
  }
  m.innerHTML += footer();
}

  el.innerHTML = ticketHtml + trackHtml + factorHtml + klineHtml;

// Chinese name → symbol mapping for common US stocks
const CN_MAP = {
  '苹果':'AAPL','微软':'MSFT','谷歌':'GOOGL','亚马逊':'AMZN','特斯拉':'TSLA',
  '英伟达':'NVDA','脸书':'META','奈飞':'NFLX','台积电':'TSM','阿里巴巴':'BABA',
  '京东':'JD','拼多多':'PDD','百度':'BIDU','网易':'NTES','蔚来':'NIO',
  '理想':'LI','小鹏':'XPEV','比亚迪':'BYD','伯克希尔':'BRK','摩根':'JPM',
  '高盛':'GS','花旗':'C','美国银行':'BAC','富国银行':'WFC','迪士尼':'DIS',
  '可口可乐':'KO','百事':'PEP','麦当劳':'MCD','星巴克':'SBUX','耐克':'NKE',
  '波音':'BA','洛克希德':'LMT','辉瑞':'PFE','强生':'JNJ','默沙东':'MRN',
  '苹果公司':'AAPL','微软公司':'MSFT','谷歌公司':'GOOGL','亚马逊公司':'AMZN',
  '特斯拉公司':'TSLA','英伟达公司':'NVDA','Meta':'META','脸书公司':'META',
  '博通':'AVGO','超微':'AMD','英特尔':'INTC','高通':'QCOM','思科':'CSCO',
  '甲骨文':'ORCL','IBM':'IBM','Salesforce':'CRM','Adobe':'ADBE',
  '雪佛龙':'CVX','埃克森美孚':'XOM','西方石油':'OXY',
  '沃尔玛':'WMT','好市多':'COST','家得宝':'HD','塔吉特':'TGT',
  '联合健康':'UNH','安进':'AMGN','礼来':'LLY','默克':'MRK',
  '维萨':'V','万事达':'MA','PayPal':'PYPL','Square':'SQ',
};

// Smart search: CN name → symbol, or direct symbol, or fuzzy match
async function smartSearch(query) {
  const q = query.trim();
  if (!q) return null;

  // 1. Direct symbol (AAPL, MSFT, etc.)
  if (/^[A-Za-z.]+$/.test(q)) return q.toUpperCase();

  // 2. Chinese name exact match
  const cnMatch = CN_MAP[q] || CN_MAP[q + '公司'];
  if (cnMatch) return cnMatch;

  // 3. Chinese name partial match
  for (const [cn, sym] of Object.entries(CN_MAP)) {
    if (cn.includes(q) || q.includes(cn)) return sym;
  }

  // 4. Fuzzy search in universe (by name or symbol)
  if (!window._universeCache) {
    window._universeCache = await api('/api/universe');
  }
  const u = window._universeCache || [];
  const upper = q.toUpperCase();
  const found = u.find(r => r.symbol === upper || (r.name||'').toUpperCase().includes(upper));
  if (found) return found.symbol;

  // 5. Last resort: try as symbol
  return q.toUpperCase();
}

function searchStock() {
  const input = $('stock-search-input');
  if (!input) return;
  const raw = input.value.trim();
  if (!raw) return;

  smartSearch(raw).then(sym => {
    if (!sym) { alert('未找到匹配的标的'); return; }
    // Show what we resolved
    const display = raw !== sym ? `${raw} → ${sym}` : sym;
    $('stock-search-resolved') && ($('stock-search-resolved').textContent = display);
    window.location.hash = `research/stock/${sym}`;
  });
}

    return;
  }

  const candidates = data.candidates;

  // Stats summary

  const avgScore = candidates.reduce((s,c)=>s+Number(c.final_score||0),0)/total;

    <div class="stat-card"><div class="label">平均分</div><div class="value">${num(avgScore,3)}</div></div>
  </div>`;

  // Candidate table with explain link
  let rows = candidates.map(c => {
    const isOfficial = c.is_official_pick;
    const classPill = c.decision?.includes('PAPER') ? 'pill-green' : c.decision?.includes('WATCH') ? 'pill-yellow' : 'pill-gray';
    return `<tr style="cursor:pointer" onclick="showExplain('${date}','${esc(c.symbol)}')">
      <td><span class="ticker">${esc(c.symbol)}</span></td>
      <td>${esc(c.stock_name||'--')}</td>
      <td style="font-family:monospace;font-weight:700">${num(c.final_score,3)}</td>
      <td>${num(c.market_score,3)}</td>
      <td>${num(c.catalyst_score,3)}</td>
      <td><span class="pill ${classPill}">${esc(c.decision||'--')}</span></td>
      <td>${isOfficial?'<span class="pill pill-green">✓</span>':'<span class="pill pill-gray">--</span>'}</td>
      <td style="font-size:11px;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.selection_reason||'--')}</td>
    </tr>`;
  }).join('');

  el.innerHTML = summary + card(`📋 ${date} 候选池`, `${total}个候选 · 点击查看详细解释`,
    `<div class="table-scroll"><table><thead><tr><th>标的</th><th>名称</th><th>总分</th><th>市场分</th><th>催化分</th><th>决策</th><th>出票</th><th>理由</th></tr></thead><tbody>${rows}</tbody></table></div>`);
}

async function showExplain(date, symbol) {
  const data = await api(`/explain/${date}/${symbol}`);
  if (!data) { alert('无数据'); return; }

  let html = `<div class="modal-overlay" onclick="this.remove()">
    <div class="modal" onclick="event.stopPropagation()" style="max-width:800px">
      <h3>🔬 <span class="ticker" style="font-size:18px">${esc(symbol)}</span> · ${date} 详细研究</h3>`;

  // Ticket info
  if (data.ticket) {
    const t = data.ticket;
    html += `<h4 style="margin:14px 0 8px;font-size:13px">🎫 出票信息</h4>
      <div class="grid-3" style="margin-bottom:12px">
        <div><div style="font-size:10px;color:var(--text-3)">综合分</div><div style="font-size:16px;font-weight:700">${num(t.ticket_score,3)}</div></div>
        <div><div style="font-size:10px;color:var(--text-3)">市场分</div><div style="font-size:16px;font-weight:700">${num(t.market_score,3)}</div></div>
        <div><div style="font-size:10px;color:var(--text-3)">催化分</div><div style="font-size:16px;font-weight:700">${num(t.catalyst_score,3)}</div></div>
      </div>
      <div style="margin-bottom:8px"><span class="pill ${t.classification?.includes('PAPER')?'pill-green':'pill-yellow'}">${esc(t.classification)}</span>
        <span class="pill ${t.risk_verdict==='CLEAN'?'pill-green':'pill-red'}" style="margin-left:4px">风险: ${esc(t.risk_verdict)}</span>
        <span class="pill pill-blue" style="margin-left:4px">质量: ${esc(t.quality_verdict)}</span></div>
      ${t.entry_reason?`<div style="padding:8px 12px;background:var(--primary-light);border-radius:8px;font-size:12px;margin-top:8px">📌 ${esc(t.entry_reason)}</div>`:''}`;
  }

  // Candidate info
  if (data.candidate) {
    const c = data.candidate;
    html += `<h4 style="margin:14px 0 8px;font-size:13px">📋 候选详情</h4>`;
    if (c.selection_reason) html += `<div style="padding:8px 12px;background:#F5E6F0;border-radius:8px;font-size:12px;margin-bottom:8px">💡 ${esc(c.selection_reason)}</div>`;
    if (c.candidate_entry_reason) html += `<div style="padding:8px 12px;background:#E8D5FF;border-radius:8px;font-size:12px;margin-bottom:8px">📝 ${esc(c.candidate_entry_reason)}</div>`;
    if (c.factor_snapshot) {
      try {
        const fs = typeof c.factor_snapshot === 'string' ? JSON.parse(c.factor_snapshot) : c.factor_snapshot;
        html += `<h4 style="margin:10px 0 6px;font-size:12px">🧬 因子快照</h4><div style="display:flex;gap:6px;flex-wrap:wrap">`;
        Object.entries(fs).forEach(([k,v]) => {
          if (v != null && typeof v === 'number') {
            html += `<div style="padding:4px 8px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;font-size:10px">
              <span style="color:var(--text-3)">${esc(k)}</span><br><strong>${num(v,4)}</strong></div>`;
          }
        });
        html += '</div>';
      } catch(e) {}
    }
  }

  // Returns
  if (data.returns?.length) {
    html += `<h4 style="margin:14px 0 8px;font-size:13px">📊 前向收益</h4>
      <table><thead><tr><th>周期</th><th>收益</th><th>状态</th></tr></thead><tbody>`;
    data.returns.forEach(r => {
      html += `<tr><td>${r.horizon_days}天</td><td class="${cls(r.forward_return)}">${r.forward_return?pct(r.forward_return):'待回填'}</td>
        <td><span class="pill ${r.check_status==='completed'?'pill-green':'pill-gray'}">${esc(r.check_status)}</span></td></tr>`;
    });
    html += '</tbody></table>';
  }

  html += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

// ── Research: Universe ──────────────────────────────────────
async function renderResearchUniverse(m) {
  m.innerHTML = header('🌐 Universe', 'Russell 3000 · 3095只标的 · 搜索浏览');

  m.innerHTML += `<div class="card" style="margin-bottom:16px"><div class="card-body">
    <div style="display:flex;gap:10px;align-items:center">
      <input type="text" id="universe-search" placeholder="搜索标的或公司名..."
        style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px"
        oninput="filterUniverse()">
      <span id="universe-count" style="font-size:11px;color:var(--text-3)">加载中...</span>
    </div>
  </div></div>`;
  m.innerHTML += '<div id="universe-content"><div class="loading">加载 Universe...</div></div>';

  const data = await api('/api/universe');
  if (!data || !data.length) {
    $('universe-content').innerHTML = '<div class="empty">Universe 为空</div>';
    m.innerHTML += footer();
    return;
  }

  // Sector summary
  const sectors = {};
  data.forEach(r => { const s = r.sector||'Unknown'; sectors[s] = (sectors[s]||0)+1; });
  const sectorHtml = Object.entries(sectors).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([s,c]) =>
    `<span class="filter-btn" onclick="filterUniverseBySector('${esc(s)}')">${esc(s)} (${c})</span>`
  ).join('');

  window._universeData = data;
  $('universe-count').textContent = `${data.length}只`;

  renderUniverseTable(data, sectorHtml);
  m.innerHTML += footer();
}

function renderUniverseTable(data, sectorHtml) {
  const el = $('universe-content');
  if (!el) return;
  let rows = data.slice(0, 100).map(r => `<tr>
    <td><a href="#research/stock/${esc(r.symbol)}" class="ticker">${esc(r.symbol)}</a></td>
    <td>${esc(r.name||'--')}</td>
    <td><span class="pill pill-blue">${esc(r.sector||'--')}</span></td>
  </tr>`).join('');
  el.innerHTML = `<div style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap">${sectorHtml||''}</div>
    <div class="card"><div class="card-head"><h2>🌐 Universe</h2><span class="sub">显示前100/${data.length}</span></div>
    <div class="card-body" style="padding:0"><div class="table-scroll" style="max-height:500px">
    <table><thead><tr><th>标的</th><th>公司名</th><th>行业</th></tr></thead><tbody>${rows}</tbody></table>
    </div></div></div>`;
}

function filterUniverse() {
  const q = ($('universe-search')?.value||'').toUpperCase();
  const data = window._universeData || [];
  const filtered = q ? data.filter(r => r.symbol?.includes(q) || (r.name||'').toUpperCase().includes(q)) : data;
  $('universe-count').textContent = `${filtered.length}/${data.length}`;
  renderUniverseTable(filtered);
}

function filterUniverseBySector(sector) {
  const data = window._universeData || [];
  const filtered = data.filter(r => r.sector === sector);
  $('universe-count').textContent = `${filtered.length}/${data.length}`;
  renderUniverseTable(filtered);
}

// ── Helpers ─────────────────────────────────────────────────
function header(title, sub) {
  return `<header class="header"><div><h1>🌙 ${title}</h1><p>${esc(sub)}</p></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="refresh-indicator live" id="page-status">● 就绪</span>
      <button onclick="renderPage()" style="padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);cursor:pointer;font-weight:600;font-size:12px">刷新</button>
    </div></header>`;
}

function statGrid(items) {
  return `<section class="stat-grid">${items.map(s => `<div class="stat-card">
    <div class="label">${s.label}</div>
    <div class="value ${s.sub||''}">${s.value}</div>
    ${s.change?`<div class="change ${s.sub||''}">${s.change}</div>`:''}
  </div>`).join('')}</section>`;
}

function card(title, sub, body) {
  return `<section class="card"><div class="card-head"><h2>${title}</h2>${sub?`<span class="sub">${esc(sub)}</span>`:''}</div><div class="card-body">${body}</div></section>`;
}

function footer() {
  return `<footer class="foot"><span>🌸 Financial OS · Xiaomei 美股 AI 投资终端</span><span>数据源: PostgreSQL · Pipeline · akshare · 纸面模拟</span></footer>`;
}

// ── Init ────────────────────────────────────────────────────
parseHash();
renderNav();
renderPage();

// Auto refresh every 30s
setInterval(() => renderPage(), 30000);
</script>
